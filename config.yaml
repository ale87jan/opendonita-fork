name: "Open Doñita"
description: "The Open Doñita server for managing your Cecotec Conga"
version: "0.3.9"
slug: "opendonita"
url: "https://github.com/ale87jan/opendonita-fork"
stage: experimental
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
image: "ghcr.io/ale87jan/opendonita-hassio"
ingress: true
ingress_port: 80
panel_icon: mdi:robot-vacuum
ports:
  80/tcp: 80
  20008/tcp: 80
  5000/tcp: 5000
  1900/udp: null
ports_description:
  80/tcp: "Web interface"
  20008/tcp: "Robot control"
  5000/tcp: "SSDP xml descriptors"
  1900/udp: "SSDP discovery"
map:
  - config:rw
